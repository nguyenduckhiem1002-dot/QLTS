services:
  postgres:
    image: postgres:16-alpine
    container_name: qlts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qlts
      POSTGRES_PASSWORD: qlts
      POSTGRES_DB: qlts
    volumes:
      - qlts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlts -d qlts"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlts-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QLTS_DEMO_MODE: "false"
      DATABASE_URL: postgresql://qlts:qlts@postgres:5432/qlts?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      QLTS_BOOTSTRAP_ADMIN_NAME: ${QLTS_BOOTSTRAP_ADMIN_NAME:-Casla Admin}
      QLTS_BOOTSTRAP_ADMIN_EMAIL: ${QLTS_BOOTSTRAP_ADMIN_EMAIL:-}
      QLTS_BOOTSTRAP_ADMIN_PASSWORD: ${QLTS_BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  qlts_postgres_data:

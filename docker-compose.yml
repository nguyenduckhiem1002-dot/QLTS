services:
  postgres:
    image: postgres:16-alpine
    container_name: qlts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qlts
      POSTGRES_PASSWORD: qlts
      POSTGRES_DB: qlts
    ports:
      - "5432:5432"
    volumes:
      - qlts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlts -d qlts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qlts_postgres_data:
